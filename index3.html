<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
        }
        th, td {
            border: 1px solid #333333;
            padding: 10px 14px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <tr>
            <td>Bàn phím cơ không dây</td>
            <td>1.250.000 VNĐ</td>
            <td>15</td>
        </tr>
        <tr>
            <td>Chuột công thái học</td>
            <td>850.000 VNĐ</td>
            <td>28</td>
        </tr>
        <tr>
            <td>Màn hình 24 inch IPS</td>
            <td>3.200.000 VNĐ</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Tai nghe chống ồn</td>
            <td>1.950.000 VNĐ</td>
            <td>7</td>
        </tr>
    </table>

</body>
</html>

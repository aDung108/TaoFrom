<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Thông Tin Cá Nhân</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 28px 32px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
            color: #1a73e8;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label.field-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333333;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="email"]:focus {
            border-color: #1a73e8;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #444444;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 11px 0;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .btn-submit {
            background-color: #1a73e8;
            color: #ffffff;
        }

        .btn-submit:hover {
            background-color: #1558b0;
        }

        .btn-reset {
            background-color: #e0e0e0;
            color: #333333;
        }

        .btn-reset:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Thông Tin Cá Nhân</h2>
        <form action="#" method="POST">
            <!-- Họ và tên -->
            <div class="form-group">
                <label class="field-label" for="yourname">Họ và tên</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên..." required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="field-label" for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <!-- Sở thích -->
            <div class="form-group">
                <label class="field-label">Sở thích</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
                    <label><input type="checkbox" name="hobby" value="music"> Nghe nhạc</label>
                    <label><input type="checkbox" name="hobby" value="sports"> Thể thao</label>
                    <label><input type="checkbox" name="hobby" value="travel"> Du lịch</label>
                </div>
            </div>

            <!-- Nút gửi & nhập lại -->
            <div class="button-group">
                <input type="submit" class="btn btn-submit" value="Gửi thông tin">
                <input type="reset" class="btn btn-reset" value="Nhập lại">
            </div>
        </form>
    </div>

</body>
</html>
